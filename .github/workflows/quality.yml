name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true

      - name: Run quality checks
        run: npm run check
