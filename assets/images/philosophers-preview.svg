      <circle cx="300" cy="70" r="29" />
      <circle cx="441" cy="173" r="29" />
      <circle cx="387" cy="338" r="29" />
      <circle cx="213" cy="338" r="29" />
      <circle cx="159" cy="173" r="29" />
    </g>
