    </g>
    <text x="300" y="213" fill="#f4f7f8">SHARED</text>
    <text x="300" y="238" fill="#aab8bd">FORKS</text>
  </g>
  <rect x="520" y="82" width="218" height="284" rx="18" fill="#171d1f" stroke="#425156" stroke-width="2" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="548" y="120" fill="#00bbff" font-size="17">MONITOR</text>
