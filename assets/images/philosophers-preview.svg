  </g>
  <circle cx="300" cy="218" r="116" fill="#171d1f" stroke="#425156" stroke-width="2" />
  <circle cx="300" cy="218" r="62" fill="#20282b" stroke="#00bbff" stroke-width="3" />
  <g stroke="#dce6e9" stroke-width="5" stroke-linecap="round">
    <path d="M300 91v32" />
    <path d="M421 178l-30 10" />
    <path d="M374 322l-18-26" />
    <path d="M226 322l18-26" />
    <path d="M179 178l30 10" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" text-anchor="middle">
