<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 450"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Philosophers thread synchronization preview</title>
  <desc id="description">
    Five philosopher threads share fork locks around a table while a monitor observes their state.
  </desc>
  <rect width="800" height="450" fill="#101415" />
  <g stroke="#263337" stroke-width="1">
